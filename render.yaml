services:
  - type: web
    name: kuberq-b2b-os
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: npx pm2-runtime start ecosystem.config.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_CONCURRENCY
        value: max
      - key: MAX_MEMORY_RESTART
        value: 480M
